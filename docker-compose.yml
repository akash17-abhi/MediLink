version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilink-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=medilink-production-secret-key-change-this
      - JWT_SECRET_KEY=medilink-jwt-secret-key-change-this
    volumes:
      - ./backend/medilink.db:/app/medilink.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: medilink-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
