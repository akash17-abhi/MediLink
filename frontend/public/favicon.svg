<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="medilink-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Modern Rounded Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#medilink-bg)" filter="url(#shadow)" />
  
  <!-- Subtle Contrast Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- MediLink Medical Heart + Pulse -->
  <g transform="translate(13, 13) scale(1.58)" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart Contour (Soft) -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" stroke="#BFDBFE" stroke-width="1.8" stroke-opacity="0.45" />
    <!-- Dynamic Lifeline Pulse -->
    <path d="M2.5 12h5l1.3-2.6 2.5 6.2 2.6-9.6 2 5.5h5.6" stroke="#FFFFFF" stroke-width="2.4" />
  </g>
</svg>
